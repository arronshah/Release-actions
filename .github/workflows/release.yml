name: Releases
on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: "main-branch"

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository with full history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      # 2. Debug: list all tags and their commits
      - name: Debug - list all tags before changelog
        run: |
          echo "=== All tags and their commits ==="
          git show-ref --tags -d
          echo ""
          echo "=== Sorted tags (by version) ==="
          git tag --sort=-v:refname
          echo ""
          echo "=== Latest reachable tag from HEAD ==="
          git describe --tags --abbrev=0

      # 3. Create and switch to a temporary branch
      - name: Create and checkout temporary branch
        run: git checkout -b "release-from-${{ github.sha }}"

      # 4. Generate changelog
      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-branch: "release-from-${{ github.sha }}"
          tag-prefix: "v"
          skip-bump: true
          skip-git-pull: true
          skip-on-empty: false

      # 5. Debug: show changelog action outputs
      - name: Debug - changelog outputs
        run: |
          echo "=== Changelog Action Outputs ==="
          echo "Skipped: ${{ steps.changelog.outputs.skipped }}"
          echo "Old tag: ${{ steps.changelog.outputs.old_tag || 'N/A' }}"
          echo "New tag: ${{ steps.changelog.outputs.tag || 'N/A' }}"
          echo ""
          echo "=== Clean changelog preview ==="
          echo "${{ steps.changelog.outputs.clean_changelog || 'No changelog generated' }}"

      # 6. Push the changelog changes to the temporary branch
      - name: Push changelog to temp branch
        if: steps.changelog.outputs.skipped == 'false'
        run: git push origin "release-from-${{ github.sha }}"

      # 7. Create PR using GitHub CLI
      - name: Create PR with release info
        if: steps.changelog.outputs.skipped == 'false'
        run: gh pr create --base main --head "release-from-${{ github.sha }}" --title 'Merge new release into main' --body 'Created by Github action'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. Merge PR using GitHub CLI
      - name: Merge PR with release info
        if: steps.changelog.outputs.skipped == 'false'
        run: gh pr merge --admin --merge --subject 'Merge release info' --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. Create GitHub release
      - name: Create release with last commit
        if: steps.changelog.outputs.skipped == 'false'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
